spring:
  application:
    name: smart-home-orchestrator

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN}"
    username: "${TELEGRAM_BOT_USERNAME}"
    owner-id: "${TELEGRAM_OWNER_ID}"

home-assistant:
  base-url: "${HOME_ASSISTANT_BASE_URL}"
  long-lived-token: "${HOME_ASSISTANT_LONG_LIVE_TOKEN}"
  test-entity-id: "${HOME_ASSISTANT_TEST_ENTITY_ID:light.zb_5}"

home-assistant-discovery:
  rules:
    light:
      enabled: true
      actions:
        - code: turn_on
          title: "Включить"
          service: turn_on

        - code: turn_off
          title: "Выключить"
          service: turn_off

        - code: toggle
          title: "Переключить"
          service: toggle

        - code: set_brightness
          title: "Изменить яркость"
          service: turn_on
          required-capability: BRIGHTNESS
          parameters:
            brightness_pct:
              type: NUMBER
              required: true
              minimum: 0
              maximum: 100
              description: "Желаемая яркость освещения в процентах"

            transition:
              type: NUMBER
              required: false
              minimum: 0
              maximum: 6553
              description: "Продолжительность плавного изменения в секундах"
              required-capability: TRANSITION

        - code: set_color
          title: "Изменить цвет"
          service: turn_on
          required-capability: COLOR
          parameters:
            rgb_color:
              type: NUMBER_LIST
              required: true
              size: 3
              item-minimum: 0
              item-maximum: 255
              description: "Цвет в формате RGB: [красный, зелёный, синий]"
            brightness_pct:
              type: NUMBER
              required: false
              minimum: 1
              maximum: 100
              description: "Необязательная яркость цвета в процентах"

        - code: set_color_temperature
          title: "Изменить температуру белого света"
          service: turn_on
          required-capability: COLOR_TEMPERATURE
          parameters:
            color_temp_kelvin:
              type: NUMBER
              required: true
              minimum: 2000
              maximum: 6500
              description: "Температура света в Кельвинах: меньше — теплее, больше — холоднее"
      excluded-entities: "light.zb_3,light.zb_2"

    switch:
      enabled: true
      actions:
        - code: turn_on
          title: "Включить"
          service: turn_on

        - code: turn_off
          title: "Выключить"
          service: turn_off

        - code: toggle
          title: "Переключить"
          service: toggle

    scene:
      enabled: true
      actions:
        - code: activate
          title: "Активировать"
          service: turn_on
      excluded-entities: "scene.thunderstorm_snapshot_rgb_strip"

    input_boolean:
      enabled: true
      actions:
        - code: turn_on
          title: "Включить"
          service: turn_on
        - code: turn_off
          title: "Выключить"
          service: turn_off
      excluded-entities: "input_boolean.arkham_mode"

llm:
  enabled: "${LLM_ENABLED:false}"
  base-url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  api-key: "${LLM_API_KEY:}"
  model: "${LLM_MODEL:openrouter/free}"
  temperature: "${LLM_TEMPERATURE:0.15}"