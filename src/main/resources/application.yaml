spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:.env.local[.properties]"
  application:
    name: smart-home-orchestrator

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN}"
    username: "${TELEGRAM_BOT_USERNAME}"
    owner-id: "${TELEGRAM_OWNER_ID}"
    owner-chat-id: "${TELEGRAM_OWNER_CHAT_ID}"
    api-url: "${TELEGRAM_BOT_API_URL}"

assistant:
  context:
    time-zone: "${ASSISTANT_TIME_ZONE:Europe/Moscow}"
  api:
    auth-token: "${ASSISTANT_AUTH_TOKEN}"

home-assistant:
  base-url: "${HOME_ASSISTANT_BASE_URL}"
  long-lived-token: "${HOME_ASSISTANT_LONG_LIVED_TOKEN}"
  test-entity-id: "${HOME_ASSISTANT_TEST_ENTITY_ID:light.zb_5}"

home-assistant-discovery:
  rules:
    sensor:
      enabled: true
      has-actions: false
      excluded-entities:
        - "sensor.backup_backup_manager_state"
        - "sensor.backup_next_scheduled_automatic_backup"
        - "sensor.badinfluencemobile_battery_state"
        - "sensor.badinfluencemobile_charger_type"
        - "sensor.vilka_battery_state"
        - "sensor.vilka_charger_type"
        - "sensor.temperature_humidity_sensor_287c_temperature"
        - "sensor.temperature_humidity_sensor_287c_humidity"
        - "sensor.temperature_humidity_sensor_287c_battery"
        - "sensor.temperature_humidity_sensor_287c_voltage"
        - "sensor.zigbee2mqtt_bridge_version"

    light:
      enabled: true
      has-actions: true
      actions:
        - code: turn_on
          title: "Включить"
          service: turn_on

        - code: turn_off
          title: "Выключить"
          service: turn_off

        - code: toggle
          title: "Переключить"
          service: toggle

        - code: set_brightness
          title: "Изменить яркость"
          service: turn_on
          required-capability: BRIGHTNESS
          parameters:
            brightness_pct:
              type: NUMBER
              required: true
              minimum: 0
              maximum: 100
              description: "Желаемая яркость освещения в процентах"

            transition:
              type: NUMBER
              required: false
              minimum: 0
              maximum: 6553
              description: "Продолжительность плавного изменения в секундах"
              required-capability: TRANSITION

        - code: set_color
          title: "Изменить цвет"
          service: turn_on
          required-capability: COLOR
          parameters:
            rgb_color:
              type: NUMBER_LIST
              required: true
              size: 3
              item-minimum: 0
              item-maximum: 255
              description: "Цвет в формате RGB: [красный, зелёный, синий]"
            brightness_pct:
              type: NUMBER
              required: false
              minimum: 1
              maximum: 100
              description: "Необязательная яркость цвета в процентах"

#        - code: set_color_temperature
#          title: "Изменить температуру белого света"
#          service: turn_on
#          required-capability: COLOR_TEMPERATURE
#          parameters:
#            color_temp_kelvin:
#              type: NUMBER
#              required: true
#              minimum: 2000
#              maximum: 6500
#              description: "Температура света в Кельвинах: меньше — теплее, больше — холоднее"

        - code: set_effect
          title: "Включить эффект"
          service: turn_on
          required-capability: EFFECT
          parameters:
            effect:
              type: STRING
              required: true
              allowed-values-from-attribute: effectList
              description: "Название эффекта"

      excluded-entities:
        - "light.zb_3"
        - "light.zb_2"

    switch:
      enabled: true
      has-actions: true
      actions:
        - code: turn_on
          title: "Включить"
          service: turn_on

        - code: turn_off
          title: "Выключить"
          service: turn_off

        - code: toggle
          title: "Переключить"
          service: toggle

    scene:
      enabled: true
      has-actions: true
      actions:
        - code: activate
          title: "Активировать"
          service: turn_on
      excluded-entities:
        - "scene.thunderstorm_snapshot_rgb_strip"

    input_boolean:
      enabled: true
      has-actions: true
      actions:
        - code: turn_on
          title: "Включить"
          service: turn_on
        - code: turn_off
          title: "Выключить"
          service: turn_off
      excluded-entities:
        - "input_boolean.arkham_mode"

llm:
  enabled: "${LLM_ENABLED:false}"
  base-url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  api-key: "${LLM_API_KEY:}"
  model: "${LLM_MODEL:openrouter/free}"
  temperature: "${LLM_TEMPERATURE:0.15}"

external-proxy:
  enabled: "${EXTERNAL_PROXY_ENABLED:false}"
  host: "${EXTERNAL_PROXY_HOST:127.0.0.1}"
  port: "${EXTERNAL_PROXY_PORT:10808}"